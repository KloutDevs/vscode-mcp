name: Feature request
description: Suggest an idea or a new tool
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't currently possible (or is too clunky)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A new tool, a change to an existing one, etc. Doesn't need to be a full spec.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
